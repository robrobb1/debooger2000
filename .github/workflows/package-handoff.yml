name: Package deboogs39 handoff

on:
  push:
    branches:
      - handoff-deboogs39-archive

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove packaging helper
        run: rm -rf .github
      - name: Upload exact deboogs39 tree
        uses: actions/upload-artifact@v4
        with:
          name: DEBOOGER2000-deboogs39-FULL
          path: .
          include-hidden-files: false
